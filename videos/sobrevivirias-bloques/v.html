 x.fillStyle='#FBF6EE';rr(-W/2-28,-36,W+56,74,37);x.fill();x.lineWidth=6;x.strokeStyle='#1d1f24';x.stroke();x.textBaseline='middle';x.textAlign='left';x.fillStyle='#1d1f24';x.fillText(a,-W/2,2);x.fillStyle=OR;x.fillText(brand,-W/2+wa,2);x.restore()}

 x.fillStyle=lerpC('#F3E6D3','#141414',dark);x.fillRect(-100,-100,1300,2200);x.fillStyle=lerpC(OR,'#221a12',dark);x.fillRect(-100,180,1300,40);
 const col=['#E86A1A','#3A7BD5','#F2C230','#5B5F66','#2FA05A','#C63A2D'];
 for(let r=0;r<4;r++){const y=330+r*250;x.fillStyle=lerpC('#8A8F96','#111',dark);x.fillRect(-100,y+170,1300,20);
  for(let i=0;i<12;i++){const w=60+((i*37+r*13)%50),hh=90+((i*29+r*7)%70);const X=-40+i*100+((r*31)%40);x.fillStyle=lerpC(col[(i+r)%6],'#151515',dark);rr(X,y+170-hh,w,hh,6);x.fill();x.fillStyle=lerpC('#ffffff','#151515',dark);x.globalAlpha=.35;x.fillRect(X+8,y+170-hh+14,w-16,10);x.globalAlpha=1}}
 x.fillStyle=lerpC('#CDBBA3','#0c0c0c',dark);x.fillRect(-100,1340,1300,700);x.strokeStyle=lerpC('#BCA88E','#0c0c0c',dark);x.lineWidth=4;for(let i=-6;i<14;i++){x.beginPath();x.moveTo(540+i*40,1340);x.lineTo(540+i*170,1920);x.stroke()}}

 x.fillStyle='#2a2333';const B=[[0,1050,120],[120,980,90],[220,1080,140],[380,1000,100],[600,1040,130],[740,960,110],[860,1060,160],[1000,1000,100]];for(const [X,Y,W] of B)x.fillRect(X,Y,W,400);
 x.fillStyle='#9C8F80';x.fillRect(-100,1300,1300,700);x.fillStyle='#7E7266';x.fillRect(-100,1290,1300,30);x.fillStyle='#B3A595';for(let i=0;i<12;i++)x.fillRect(i*100,1320,4,600)}

 x.beginPath();x.ellipse(-22,-54,24,12,-.5,0,7);x.fill();x.stroke();x.beginPath();x.ellipse(22,-60,24,12,.5,0,7);x.fill();x.stroke();x.restore()}

 x.translate(X,Y);x.rotate(-.04);x.fillStyle=col;x.fillText(txt,-w/2,0);for(let i=0;i<Math.floor(w/55);i++){const dx=-w/2+20+i*55+((i*17)%23),L=20+((i*31)%50);x.fillRect(dx,size*.3,7,L);x.beginPath();x.arc(dx+3.5,size*.3+L,6,0,7);x.fill()}x.restore()}

 x.font='900 34px I';const t1='REGLA 0'+n,w1=x.measureText(t1).width;x.fillStyle=YE;rr(-w1/2-18,-118,w1+36,52,6);x.fill();x.fillStyle='#1d1f24';x.fillText(t1,0,-91);
 x.font='900 92px I';let w=x.measureText(tt).width;const f=Math.min(1,980/w);x.scale(f,f);x.lineJoin='round';x.lineWidth=16;x.strokeStyle='#111';x.strokeText(tt,0,0);x.fillStyle='#fff';x.fillText(tt,0,0);x.restore()}

 x.beginPath();x.moveTo(X,Y);x.lineTo(lerp(X,LX,e),lerp(Y,LY,e));x.stroke();if(k>.6){x.globalAlpha=cl((k-.6)/.4);x.font='900 34px I';const w=x.measureText(label).width;let bx=LX<X?LX-w-28:LX;bx=Math.max(30,Math.min(1050-w-28,bx));x.fillStyle='rgba(0,0,0,.7)';rr(bx,LY-28,w+28,56,6);x.fill();x.fillStyle=YE;x.textAlign='left';x.textBaseline='middle';x.fillText(label,bx+14,LY+2)}x.restore()}
function cap2(t,y=1120){let g=null;for(const G of GROUPS)if(t>=G.st[0]-0.02&&t<G.end)g=G;if(!g)return;
 x.font='900 58px I';const W=[...g.ws].map(w=>w.toUpperCase());const sp=x.measureText(' ').width;const ws=W.map(w=>x.measureText(w).width);
 // hasta 2 renglones
 const tot=ws.reduce((a,b)=>a+b,0)+sp*(ws.length-1);let br=W.length;if(tot>900){let acc=0;for(let i=0;i<W.length;i++){acc+=ws[i]+sp;if(acc>tot/2){br=i+1;break}}}
 const rows=[[0,br],[br,W.length]].filter(([a,b])=>b>a);let cur=0;for(let i=0;i<g.ws.length;i++)if(t>=g.st[i])cur=i;

 rows.forEach(([a,b],r)=>{const rw=ws.slice(a,b).reduce((p,q)=>p+q,0)+sp*(b-a-1);let X=540-rw/2;const Y=y+r*72-(rows.length-1)*36;
  for(let i=a;i<b;i++){x.lineWidth=12;x.strokeStyle='rgba(0,0,0,.85)';x.strokeText(W[i],X,Y);x.fillStyle=i===cur?YE:'#fff';x.fillText(W[i],X,Y);X+=ws[i]+sp}})}

// ---------- mundo de bloques ----------
const SKY={dawn:['#7FB8E8','#FFC98A'],day:['#58B4F0','#BFE6FF'],dusk:['#3E3A78','#FF8A50'],night:['#070B1C','#1B2346']};

function bev(X,Y,W,H,c,dark,light){x.fillStyle=c;rr(X,Y,W,H,8);x.fill();x.fillStyle=light;rr(X+5,Y+5,W-10,12,5);x.fill();x.fillStyle=dark;rr(X+5,Y+H-15,W-10,10,5);x.fill();x.strokeStyle='rgba(0,0,0,.35)';x.lineWidth=3;rr(X,Y,W,H,8);x.stroke()}
function world(t,sky,darkK=0){const g=x.createLinearGradient(0,0,0,1500);g.addColorStop(0,sky[0]);g.addColorStop(1,sky[1]);x.fillStyle=g;x.fillRect(-100,-100,1300,2200);
 // sol o luna redondos (no cuadrados)
 const sunY=lerp(1300,260,cl(1-darkK));x.fillStyle=darkK>.5?'#F4EBD0':'#FFE27A';x.beginPath();x.arc(840,darkK>.5?260:sunY,70,0,7);x.fill();
 // nubes de bloques
 x.globalAlpha=.85*(1-darkK*.7);for(const [cx,cy] of [[180,300],[620,200],[900,430]]){const o=(t*18)%1400;const X=((cx+o)%1400)-200;for(const [dx,dy] of [[0,0],[70,0],[140,0],[35,-50],[105,-50]])bev(X+dx,cy+dy,70,50,'#FFFFFF','#E6ECF2','#FFFFFF')}x.globalAlpha=1;
 // colinas lejanas de bloques
 for(let i=0;i<14;i++){const h=2+((i*7)%4);for(let j=0;j<h;j++)bev(-40+i*90,1410-j*90,90,90,lerpC('#7FBF6A','#24331E',darkK),lerpC('#5FA04C','#1A2516',darkK),lerpC('#9AD67F','#2C3D25',darkK))}
 // suelo
 for(let i=0;i<13;i++){bev(-40+i*90,1500,90,90,lerpC('#6DBF4B','#1F3018',darkK),lerpC('#4E9A35','#162212',darkK),lerpC('#8FD86C','#2A3F21',darkK));for(let r=1;r<5;r++)bev(-40+i*90,1500+r*90,90,90,lerpC('#9C6B43','#2A1E15',darkK),lerpC('#7A5233','#1F160F',darkK),lerpC('#B5845A','#352619',darkK))}}
