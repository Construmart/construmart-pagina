<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:I;src:url(file:///usr/share/fonts/opentype/inter/Inter-ExtraBold.otf);font-weight:800}
@font-face{font-family:I;src:url(file:///usr/share/fonts/opentype/inter/Inter-Black.otf);font-weight:900}
*{margin:0;box-sizing:border-box}html,body{width:1080px;height:1920px;overflow:hidden;font-family:I;background:#1d2340}
.abs{position:absolute}
#wall{inset:0;background:linear-gradient(#232a4d,#1a1f3a)}
#floor{left:0;right:0;bottom:0;height:520px;background:#3a2a22}
#rug{left:120px;right:120px;bottom:120px;height:220px;border-radius:50%;background:#FF6A00;opacity:.35}
#tv{left:90px;top:300px;width:600px;height:360px;background:#111;border:18px solid #2E3033;border-radius:24px;overflow:hidden}
#scr{inset:0;background:linear-gradient(135deg,#6ec6ff,#ffd23f 50%,#ff6a00)}
#scr b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:120px}
#stand{left:300px;top:678px;width:180px;height:30px;background:#2E3033;border-radius:8px}
#glow{left:-200px;top:100px;width:1300px;height:1500px;background:radial-gradient(circle at 30% 25%,rgba(150,210,255,.35),transparent 55%)}
#mart{width:860px;left:200px;top:820px;filter:drop-shadow(0 30px 30px rgba(0,0,0,.45))}
#pop{left:70px;top:1180px;width:230px;height:220px}
#pop .cup{position:absolute;left:30px;top:70px;width:170px;height:150px;background:repeating-linear-gradient(90deg,#d93025 0 28px,#fff 28px 56px);clip-path:polygon(0 0,100% 0,85% 100%,15% 100%)}
#pop i{position:absolute;width:60px;height:56px;border-radius:50%;background:#fff6d8;box-shadow:inset -6px -6px 0 #f3dc9a}
.chip{position:absolute;left:0;right:0;margin:auto;text-align:center;font-weight:900;color:#fff;letter-spacing:-2px}
#t1{top:90px;font-size:104px;line-height:.98;text-shadow:0 10px 0 rgba(0,0,0,.35)}
#t1 span{color:#FFD23F}
#cap{position:absolute;left:60px;right:60px;top:1420px;text-align:center}
#cap span{background:rgba(30,31,34,.9);padding:10px 22px;border-radius:18px;line-height:1.7;font-weight:800;font-size:56px;color:#fff;box-decoration-break:clone;-webkit-box-decoration-break:clone}
#zz{left:820px;top:820px;font-size:80px;font-weight:900;color:#fff}
</style></head><body>
<div class="abs" id="wall"></div><div class="abs" id="floor"></div><div class="abs" id="rug"></div>
<div class="abs" id="tv"><div class="abs" id="scr"><b>🎬</b></div></div><div class="abs" id="stand"></div>
<div class="abs" id="glow"></div>
<img class="abs" id="mart" src="mart-sofa.png">
<div class="abs" id="pop"><i style="left:40px;top:40px"></i><i style="left:90px;top:20px"></i><i style="left:140px;top:44px"></i><i style="left:70px;top:58px"></i><i style="left:120px;top:62px"></i><div class="cup"></div></div>
<div class="chip" id="t1">¿O MEJOR UNA<br><span>PELI EN CASA?</span> 🍿</div>
<div id="cap"></div>
<script>
const $=id=>document.getElementById(id),cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const back=x=>{x=cl(x);const c=1.9;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const CAPS=[[0,1.6,"¿O prefieres quedarte en el sofá"],[1.6,3.0,"<b style='color:#FFD23F'>viendo una película?</b>"]];
window.R=t=>{
 $("t1").style.transform=`scale(${back(t/.35)})`;
 $("mart").style.transform=`translateY(${(1-back((t-.1)/.45))*500}px) rotate(${Math.sin(t*3)*2}deg)`;$("mart").style.transformOrigin="50% 100%";
 $("pop").style.transform=`scale(${back((t-.4)/.3)})`;
 const f=.75+.25*Math.abs(Math.sin(t*9)*Math.sin(t*4.3));$("glow").style.opacity=f;$("scr").style.filter=`hue-rotate(${t*90}deg) brightness(${f+.2})`;
 let c="";for(const x of CAPS)if(t>=x[0])c=x[2];$("cap").innerHTML=`<span>${c}</span>`;
};R(0);
</script></body></html>
